name: Release Obsidian plugin

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Run from the Actions tab on main: releases the version in manifest.json and creates its tag.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Resolve release version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then echo "Run the release from main." >&2; exit 1; fi
            version=$(node -p "require('./manifest.json').version")
            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
              echo "Tag $version already exists." >&2; exit 1
            fi
          else
            version="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify release version
        run: |
          node -e "const m=require('./manifest.json'); const p=require('./package.json'); if (m.version !== p.version || m.version !== process.env.RELEASE_VERSION) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="${RUNNER_TEMP}/bases-visuals-release-notes.md"
          printf "%s\n\n" "More software, tools, and ideas: [gabrielbacha.com](https://www.gabrielbacha.com/?utm_source=github&utm_medium=referral&utm_campaign=obsidian_assets&utm_content=bases_visuals_release)" > "$release_notes"
          cat CHANGELOG.md >> "$release_notes"
          # On a manual run the tag does not exist yet: --target creates it at this commit.
          gh release create "$RELEASE_VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --notes-file "$release_notes" \
            main.js manifest.json styles.css
