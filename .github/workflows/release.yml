name: Release Obsidian plugin

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify release version
        run: |
          node -e "const m=require('./manifest.json'); const p=require('./package.json'); if (m.version !== p.version || m.version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="${RUNNER_TEMP}/bases-visuals-release-notes.md"
          printf "%s\n\n" "More software, tools, and ideas: [gabrielbacha.com](https://www.gabrielbacha.com/?utm_source=github&utm_medium=referral&utm_campaign=obsidian_assets&utm_content=bases_visuals_release)" > "$release_notes"
          cat CHANGELOG.md >> "$release_notes"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$release_notes" \
            main.js manifest.json styles.css
